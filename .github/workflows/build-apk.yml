name: Android APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android SDK kur
      uses: android-actions/setup-android@v4

    - name: Resmi Gradle Motorunu İndir ve Kur
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip

    - name: Telefon ve TV APK Dosyalarını Derle
      run: |
        export PATH=$PWD/gradle-8.5/bin:$PATH
        gradle assembleDebug

    - name: APK Dosyalarını Kontrol Et
      run: |
        ls -la app/build/outputs/apk/debug/ || true
        ls -la tv/build/outputs/apk/debug/ || true

    - name: APK Dosyalarını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: oyun-ceviri-apk-dosyalari
        path: |
          app/build/outputs/apk/debug/*.apk
          tv/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
