name: Build APKs
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Gradle wrapper yerini düzelt
        run: |
          mkdir -p gradle/wrapper
          # root'ta yanlış yerde duran dosyaları doğru yere taşı
          if [ -f gradle-wrapper.jar ]; then mv gradle-wrapper.jar gradle/wrapper/ -f; fi
          if [ -f gradle-wrapper.properties ]; then mv gradle-wrapper.properties gradle/wrapper/ -f; fi
          if [ -f gradlew ]; then chmod +x gradlew; fi
          ls -R gradle
          ls -lh gradle/wrapper/

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APKs
        run: ./gradlew assembleDebug --stacktrace

      - name: APK'leri yükle
        uses: actions/upload-artifact@v4
        with:
          name: oyun-ceviri-apks
          path: |
            **/build/outputs/apk/debug/*.apk
