
name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APK oluştur
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Android SDK kur
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Gradle izinlerini ayarla
        run: chmod +x gradlew

      - name: Telefon ve TV APK dosyalarını derle
        run: ./gradlew --no-daemon assembleDebug

      - name: APK dosyalarını kontrol et
        run: |
          echo "Oluşturulan APK dosyaları:"
          find . -type f -path "*/build/outputs/apk/*/*.apk"

      - name: APK dosyalarını yükle
        uses: actions/upload-artifact@v4
        with:
          name: oyun-ceviri-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            tv/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
