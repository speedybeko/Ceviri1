name: Android APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android SDK kur
      uses: android-actions/setup-android@v4

    - name: Gradle Wrapper Kontrolü ve Tamamlama
      run: |
        mkdir -p gradle/wrapper
        if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
          curl -L https://raw.githubusercontent.com/gradle/gradle/v8.5.0/subprojects/wrapper/src/main/resources/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
        fi

    - name: Gradle izinlerini ayarla
      run: chmod +x gradlew

    - name: Telefon ve TV APK dosyalarını derle
      run: ./gradlew assembleDebug

    - name: APK dosyalarını kontrol et
      run: |
        ls -la app/build/outputs/apk/debug/ || true
        ls -la tv/build/outputs/apk/debug/ || true

    - name: APK dosyalarını yükle
      uses: actions/upload-artifact@v4
      with:
        name: oyun-ceviri-apk-dosyalari
        path: |
          app/build/outputs/apk/debug/*.apk
          tv/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
