name: Android APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android SDK kur
      uses: android-actions/setup-android@v4

    - name: Gradle 8.5 Doğrudan Kur
      run: |
        wget https://services.gradle.org/distributions/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip
        echo "$PWD/gradle-8.5/bin" >> $GITHUB_PATH

    - name: APK Dosyalarını Derle
      run: gradle assembleDebug --stacktrace

    - name: APK Dosyalarını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: oyun-ceviri-apk-dosyalari
        path: |
          app/build/outputs/apk/debug/*.apk
          tv/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
