name: Android APK Oluştur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Android SDK kur
      uses: android-actions/setup-android@v4

    - name: Gradle izinlerini ayarla
      run: chmod +x gradlew

    - name: Telefon ve TV APK dosyalarını derle
      run: ./gradlew assembleDebug

    - name: APK dosyalarını kontrol et
      run: ls -la app/build/outputs/apk/debug/

    - name: APK dosyalarını yükle
      uses: actions/upload-artifact@v4
      with:
        name: apk-dosyalari
        path: |
          app/build/outputs/apk/debug/*.apk
          **/build/outputs/apk/debug/*.apk
