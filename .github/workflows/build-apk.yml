name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu indir
      uses: actions/checkout@v4

    - name: Java 17 kur
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gradle kur
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Gradle Wrapper Jar dosyasini yeniden olustur
      run: |
        rm -f gradle/wrapper/gradle-wrapper.jar
        gradle wrapper --gradle-version 8.5

    - name: Gradle izinlerini ayarla
      run: chmod +x ./gradlew

    - name: Telefon ve TV APK dosyalarini derle
      run: ./gradlew assembleDebug

    - name: APK dosyalarini yukle
      uses: actions/upload-artifact@v4
      with:
        name: apk-dosyalari
        path: |
          app/build/outputs/apk/debug/*.apk
          tv/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
